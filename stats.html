<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Stats</title>
<style>body{font-family:Arial,sans-serif;max-width:560px;margin:20px auto;padding:0 16px}td{padding:6px 10px;border-bottom:1px solid #eee}td:last-child{text-align:right;font-weight:bold}h2{margin-top:28px}</style></head>
<body><h1>God Openly: visits</h1><div id="out">Loading…</div>
<script>
var NS="godopenly-v1",G="https://abacus.jasoncameron.dev/get/"+NS+"/";
var SRC=["youtube","short","long","direct","shorts-fast","long-fast"];
var rows=[["Landing page views","landing"],["Unique visitors","landing-uniq"],["Thank-you page (= signups)","thanks"],["PDF downloads from thank-you","pdf-thanks"]];
SRC.forEach(function(s){rows.push(["Landing from: "+s,"landing-src-"+s]);});
function get(k){return fetch(G+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return 0});}
Promise.all(rows.map(function(r){return get(r[1])})).then(function(v){
  var L=v[0],T=v[2],h="<table>";
  rows.forEach(function(r,i){h+="<tr><td>"+r[0]+"</td><td>"+v[i]+"</td></tr>";});
  h+="<tr><td>Signup rate</td><td>"+(L?(100*T/L).toFixed(1):"0")+"%</td></tr></table>";
  document.getElementById("out").innerHTML=h;});
</script></body></html>
